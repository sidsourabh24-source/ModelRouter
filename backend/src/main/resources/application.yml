spring:
  application:
    name: modelrouter-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:modelrouter_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  sql:
    init:
      mode: never

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 1000ms

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

modelrouter:
  cache:
    enabled: true
    ttl-minutes: 60
  security:
    header-name: X-API-Key
  mock-providers:
    latency-min-ms: 40
    latency-max-ms: 250
